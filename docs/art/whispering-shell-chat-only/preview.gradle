// Reuse the native chat scenario fixture without overriding production behavior or assets.
gradle.beforeProject { project ->
    if (project.projectDir.name == 'vestige') {
        project.layout.buildDirectory.set(project.file('run/whispering-shell-chat-only-build'))
        project.afterEvaluate {
            project.tasks.named('generateModMetadata').configure {
                into project.layout.buildDirectory.dir('generated/sources/modMetadata')
            }
            project.sourceSets.main.java.srcDir(project.file('docs/art/whispering-shell-symbol-chat/preview-source'))
            project.neoForge.runs.effectsCapture.programArguments.set(['--width', '480', '--height', '360'])
            project.tasks.withType(JavaCompile).configureEach { options.incremental = false }
            project.tasks.named('runEffectsCapture').configure { maxHeapSize = '2G' }
        }
    }
}
