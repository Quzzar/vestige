gradle.beforeProject { project ->
    if (project.projectDir.name == 'vestige') {
        project.layout.buildDirectory.set(project.file('run/whispering-shell-chat-only-production-build'))
        project.afterEvaluate {
            project.tasks.named('generateModMetadata').configure {
                into project.layout.buildDirectory.dir('generated/sources/modMetadata')
            }
            project.tasks.withType(JavaCompile).configureEach { options.incremental = false }
        }
    }
}
