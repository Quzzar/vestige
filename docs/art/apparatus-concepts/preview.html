}

.table :is(th, td):last-child {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

.table .text-nowrap {

#widget {

.card {

  corner-shape: var(--corner-shape);

/** A native model face with its exported UV region, retaining element rotations. */
function faceGeometry(element,side){
  const a=element.from.map(v=&gt;v/16),b=element.to.map(v=&gt;v/16);
  const [x,y,z]=a,[X,Y,Z]=b;
  const points={
    north:[[X,y,z],[x,y,z],[x,Y,z],[X,Y,z]],south:[[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]],
    east:[[X,y,Z],[X,y,z],[X,Y,z],[X,Y,Z]],west:[[x,y,z],[x,y,Z],[x,Y,Z],[x,Y,z]],
    up:[[x,Y,Z],[X,Y,Z],[X,Y,z],[x,Y,z]],down:[[x,y,z],[X,y,z],[X,y,Z],[x,y,Z]]
  }[side];
  const uv=element.faces[side].uv.map(v=&gt;v/16);
  const uvs=[uv[0],1-uv[3],uv[2],1-uv[3],uv[2],1-uv[1],uv[0],1-uv[1]];
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute(&#x27;position&#x27;,new THREE.Float32BufferAttribute(points.flat(),3));
  geometry.setAttribute(&#x27;uv&#x27;,new THREE.Float32BufferAttribute(uvs,2));
  geometry.setIndex([0,1,2,0,2,3]); geometry.computeVertexNormals();
  return geometry;
}

function material(key){

}

/** Glyphs stay luminous in shade. The halo follows their alpha mask, including empty gaps. */
function runeMaterial(){
  const style=DATA.runePresentation;
  const strength=style.core_brightness;
  return new THREE.MeshBasicMaterial({map:textures.runes,color:new THREE.Color(strength,strength,strength),
    side:THREE.DoubleSide,transparent:true,alphaTest:.08,depthWrite:false,toneMapped:false});
}

function runeHaloMaterial(){
  const style=DATA.runePresentation;
  return new THREE.ShaderMaterial({
    uniforms:{glyphs:{value:textures.runes},
      texel:{value:new THREE.Vector2(1/textures.runes.image.width,1/textures.runes.image.height)},
      radius:{value:style.halo_radius_texels},opacity:{value:style.halo_opacity},
      glowColor:{value:new THREE.Color(...style.halo_color)}},
    vertexShader:`varying vec2 glyphUv;
      void main(){glyphUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform sampler2D glyphs;uniform vec2 texel;uniform float radius;
      uniform float opacity;uniform vec3 glowColor;varying vec2 glyphUv;
      void main(){
        float halo=0.0;float total=0.0;
        for(int x=-2;x&lt;=2;x++){for(int y=-2;y&lt;=2;y++){
          vec2 offset=vec2(float(x),float(y));float weight=exp(-dot(offset,offset)*0.55);
          halo+=texture2D(glyphs,glyphUv+offset*texel*radius).a*weight;total+=weight;
        }}
        float alpha=halo/total*opacity;if(alpha&lt;0.015)discard;
        gl_FragColor=vec4(glowColor,alpha);
      }`,
    side:THREE.DoubleSide,transparent:true,depthWrite:false,toneMapped:false,
  });
}

function makeModel(name){
  const group=new THREE.Group();
  const model=DATA.models[name];
  const mats={};
  for(const key of [&#x27;stone&#x27;,&#x27;carving&#x27;,&#x27;trim&#x27;]) mats[key]=material(state.material+&#x27;-&#x27;+key);
  for(const key of [&#x27;amethyst&#x27;,&#x27;diamond&#x27;]) mats[key]=material(key);
  for(const element of model.elements){
    const part=new THREE.Group();
    for(const [side,face] of Object.entries(element.faces)){
      const isRune=face.texture===&#x27;#runes&#x27;;
      const mesh=new THREE.Mesh(faceGeometry(element,side),isRune?runeMaterial():mats[face.texture.slice(1)]);
      mesh.castShadow=!isRune;mesh.receiveShadow=!isRune;
      if(isRune)mesh.renderOrder=10;
      part.add(mesh);
      if(isRune){
        const halo=new THREE.Mesh(faceGeometry(element,side),runeHaloMaterial());
        halo.renderOrder=8;part.add(halo);
      }
    }
    if(element.rotation){
      const origin=new THREE.Vector3(...element.rotation.origin.map(v=&gt;v/16));
      const pivot=new THREE.Group();pivot.position.copy(origin);part.position.copy(origin).negate();
      pivot.rotation[element.rotation.axis]=THREE.MathUtils.degToRad(element.rotation.angle);
      pivot.add(part); group.add(pivot);
    }else group.add(part);
  }
  group.position.set(-.5,0,-.5);
  if(name===&#x27;plinth&#x27; &amp;&amp; state.socket!==&#x27;empty&#x27;){
    const gemMaterial=material(state.socket);
    for(let side=0;side&lt;4;side++){
      const socket=new THREE.Mesh(new THREE.BoxGeometry(DATA.socket.width/16,DATA.socket.height/16,DATA.socket.depth/16),gemMaterial);
      socket.position.set(0,DATA.socket.center[1]/16,(DATA.socket.center[2]-8)/16);
      const turn=new THREE.Group();turn.rotation.y=side*Math.PI/2;turn.add(socket);
      turn.position.set(.5,0,.5); group.add(turn);
    }
  }
  if(name===&#x27;spellstone&#x27; &amp;&amp; state.scroll){
    const scroll=new THREE.Group();
    const sheet=new THREE.Mesh(new THREE.BoxGeometry(.43,.017,.29),new THREE.MeshStandardMaterial({color:0xddcc9e,roughness:1}));
    sheet.position.set(0,7.18/16,0); scroll.add(sheet);
    const ink=new THREE.MeshStandardMaterial({color:0x746146,roughness:1});
    for(let i=0;i&lt;5;i++){
      const line=new THREE.Mesh(new THREE.BoxGeometry(.25-(i%3)*.025,.002,.009),ink);
      line.position.set(0,7.34/16,-.064+i*.027);scroll.add(line);
    }
    const rodMat=new THREE.MeshStandardMaterial({color:0xa39270,roughness:1});
    for(const z of [-.155,.155]){
      const rod=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.49,8),rodMat);
      rod.rotation.z=Math.PI/2;rod.position.set(0,7.4/16,z); scroll.add(rod);
    }
    scroll.position.set(.5,0,.5);scroll.rotation.y=-.065; group.add(scroll);
  }
  return group;
}
