// A production build, isolated from concurrent client runs and art-only fixtures.
gradle.beforeProject { project ->
    if (project.projectDir.name == 'vestige') {
        project.layout.buildDirectory.set(project.file('run/attuned-items-locked-production-build'))
        project.afterEvaluate {
            project.tasks.withType(JavaCompile).configureEach { options.incremental = false }
        }
    }
}
