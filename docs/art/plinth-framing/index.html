<!doctype html>

<style>
*{box-sizing:border-box}
body{margin:0;padding:36px;background:#20211f;color:#eee;font:15px/1.5 system-ui,sans-serif}
main{max-width:1600px;margin:auto}
h1{font-size:26px;font-weight:600;margin:0 0 6px}
p{margin:0 0 28px;color:#babdb7}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
figure{margin:0;background:#2c2e2b;border:1px solid #4a4d46}
img{width:100%;height:auto;display:block}
figcaption{padding:16px 18px}
strong{display:block;font-size:18px;font-weight:600}
small{display:block;color:#c0c4bb;font-size:14px;margin-top:4px}
a{color:inherit}
a:focus-visible{outline:2px solid #d5d8cc;outline-offset:3px;display:block}
h2{font-size:18px;font-weight:500;margin:28px 0 14px}details{margin-top:28px}summary{cursor:pointer;color:#c0c4bb;margin-bottom:16px}summary:focus-visible{outline:2px solid #d5d8cc;outline-offset:4px}
footer{color:#aeb4aa;margin-top:24px}
@media(max-width:850px){body{padding:22px}.choices{grid-template-columns:1fr}}
</style>
