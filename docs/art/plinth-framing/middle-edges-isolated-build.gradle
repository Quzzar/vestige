// Separate outputs and Gradle state protect other active development runs.
gradle.beforeProject { project ->
    if (project.projectDir.name == 'vestige') {
        project.layout.buildDirectory.set(project.layout.projectDirectory.dir('build/apparatus-middle-edges-review'))
    }
}
gradle.projectsEvaluated {
    gradle.rootProject.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
        options.incremental = false
    }
}
