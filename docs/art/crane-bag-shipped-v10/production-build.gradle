// Frozen input prevents concurrent work from changing this verification build.
gradle.beforeProject { project ->
    if (project.projectDir.name == 'vestige') {
        project.layout.buildDirectory.set(project.file('run/crane-bag-shipped-build'))
        project.afterEvaluate {
            project.sourceSets.main.java.setSrcDirs([project.file('run/crane-bag-shipped-input/src/main/java')])
            project.sourceSets.main.resources.setSrcDirs([project.file('run/crane-bag-shipped-input/src/main/resources'), project.tasks.named('generateModMetadata')])
            project.sourceSets.test.java.setSrcDirs([project.file('run/crane-bag-shipped-input/src/test/java')])
            project.sourceSets.test.resources.setSrcDirs([project.file('run/crane-bag-shipped-input/src/test/resources')])
            project.tasks.named('generateModMetadata').configure {
                into project.layout.buildDirectory.dir('generated/sources/modMetadata')
            }
            project.tasks.withType(JavaCompile).configureEach { options.incremental = false }
        }
    }
}
