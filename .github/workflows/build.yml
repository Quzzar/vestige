name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Verify spell recipes, balance, documentation and actual recordings
        run: |
          python3 tools/convert_irons_spells.py
          python3 tools/convert_pathfinder_spells.py
          python3 tools/convert_pathfinder_spells.py --check
          python3 tools/document_spells.py --check
          python3 tools/audit_spell_balance.py --check
          python3 tools/document_spell_balance.py --check
          python3 tools/document_pathfinder_inventory.py --check
          python3 tools/document_pathfinder_selection.py --check
          python3 tools/document_spell_art.py --check
          python3 tools/export_spell_effects.py --check
          python3 tools/test_spell_balance.py
          python3 tools/author_magic_adjectives.py --check
          python3 tools/test_spell_presentation.py
          python3 tools/test_native_capture.py
          python3 tools/encode_native_capture.py --check --complete
          git diff --exit-code
      - name: Build and test standalone Vestige
        run: ./gradlew check build runGameTestServer -Pwith_kithkyn=false
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: vestige-jars
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Preserve test reports and server logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vestige-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            run/logs/
            run/crash-reports/
          if-no-files-found: warn

  cast-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/effects-viewer
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
